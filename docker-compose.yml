services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: carsalepro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: carsalepro
      POSTGRES_PASSWORD: carsalepro
      POSTGRES_DB: carsalepro
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carsalepro -d carsalepro"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: carsalepro-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # S3-compatible local stand-in for Cloudflare R2 (dev only).
  minio:
    image: minio/minio:latest
    container_name: carsalepro-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: carsalepro
      MINIO_ROOT_PASSWORD: carsalepro-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: carsalepro-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://carsalepro:carsalepro@postgres:5432/carsalepro?schema=public
      REDIS_URL: redis://redis:6379
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-carsalepro-reports}
      FREE_REPORTS_LIMIT: ${FREE_REPORTS_LIMIT:-3}
      JWT_SECRET: ${JWT_SECRET:-dev-shared-secret-change-me}
      SENTRY_DSN: ${SENTRY_DSN:-}
    ports:
      - "3000:3000"
    profiles:
      - full

volumes:
  postgres_data:
  redis_data:
  minio_data:
