services:
  postgres:
    image: postgres:16-alpine
    container_name: carsalepro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: carsalepro
      POSTGRES_PASSWORD: carsalepro
      POSTGRES_DB: carsalepro
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carsalepro -d carsalepro"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: carsalepro-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://carsalepro:carsalepro@postgres:5432/carsalepro?schema=public
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-carsalepro-reports}
      FREE_REPORTS_LIMIT: ${FREE_REPORTS_LIMIT:-3}
      SENTRY_DSN: ${SENTRY_DSN:-}
    ports:
      - "3000:3000"
    profiles:
      - full

volumes:
  postgres_data:
