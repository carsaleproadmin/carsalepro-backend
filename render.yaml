# Render Blueprint for CarSalePro backend.
# Useful as documentation even when the service is created via the MCP CLI.

services:
  - type: web
    name: carsalepro-backend
    runtime: docker
    plan: starter
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: LOG_LEVEL
        value: info
      - key: FREE_REPORTS_LIMIT
        value: "3"
      # FREE is unlimited since 2026-08; PRO sells no-ads + branding
      - key: ENFORCE_FREE_REPORT_LIMIT
        value: "false"
      - key: PRESIGNED_UPLOAD_TTL
        value: "900"
      - key: PRESIGNED_DOWNLOAD_TTL
        value: "3600"
      - key: NHTSA_BASE_URL
        value: https://vpic.nhtsa.dot.gov/api
      - key: DATABASE_URL
        fromDatabase:
          name: carsalepro-db
          property: connectionString
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: carsalepro-reports
      # R2_PUBLIC_URL is RETIRED and must not be re-added. It made every object
      # in the reports bucket — paid inspection PDFs included — resolve to an
      # unsigned URL. The boot now refuses to start if it is set in production.
      # Public images come from their own bucket below.
      - key: R2_PUBLIC_BUCKET
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false
      - key: R2_PUBLIC_ACCESS_KEY_ID
        sync: false
      - key: R2_PUBLIC_SECRET_ACCESS_KEY
        sync: false
      - key: R2_KYC_BUCKET
        sync: false
      - key: R2_KYC_ACCESS_KEY_ID
        sync: false
      - key: R2_KYC_SECRET_ACCESS_KEY
        sync: false
      # Pinned, not left to the code default: address verification and password
      # reset are delivered by email only, and Resend refuses a From address
      # whose domain it has not verified. `notifications.carsalepro.de` is the
      # verified domain — the apex is not. Changing this to an unverified
      # domain silently stops every account-recovery mail.
      - key: EMAIL_FROM
        value: CarSalePro <no-reply@notifications.carsalepro.de>
      - key: RESEND_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production

databases:
  - name: carsalepro-db
    # Matches the live instance, verified against the Render API on 2026-08-28.
    # This said `free`, which was never true of the running database and was
    # actively misleading: a Free Postgres has NO backups and NO point-in-time
    # recovery, expires 30 days after creation and is then deleted with its
    # contents. Anybody reading this file to answer "can we restore?" would
    # have got the wrong answer at the worst possible moment.
    plan: basic_256mb
    region: frankfurt
    postgresMajorVersion: "16"
